<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:svg="http://www.w3.org/2000/svg" version="1.1"
	 xmlns:xlink="http://www.w3.org/1999/xlink"
     width="660" height="660" viewBox="0 0 660 660">
	<title>Logo Jewiki</title>
	<defs
		id="defs1">
		<path
		   id="triangle"
		   d="m -100,58 h 200 l -100,-173 z" />
		<path
		   id="line"
		   d="m -70,58 h 70" />
		<g id="line_fragments">
			<use xlink:href="#line" transform="rotate(0)"/>
			<use xlink:href="#line" transform="rotate(120)"/>
			<use xlink:href="#line" transform="rotate(-120)"/>
		</g>
	</defs>
	<rect width="660" height="660" style="fill:yellow;stroke:none"/>
	<g id="path-A"
		style="fill:none;stroke:#0F45A5;stroke-width:16px"
		transform="translate(330,256)scale(1.9)">
		<use xlink:href="#triangle" style="stroke:magenta;stroke-width:20px"/>
		<use xlink:href="#triangle"/>
		<g id="path-B"
			transform="rotate(60)">
			<use xlink:href="#triangle" style="stroke:magenta;stroke-width:20px"/>
			<use xlink:href="#triangle"/>
		</g>
		<use xlink:href="#line_fragments" style="fill:none;stroke:magenta;stroke-width:20px"/>
		<use xlink:href="#line_fragments" style="fill:none;stroke:#0F45A5;stroke-width:16px"/>
	</g>
	<text
		id="text"
		style="fill:#0F45A5;font-size:220px;font-variant:small-caps;text-anchor:middle"
		x="330"
		y="630">Jewiki</text>
</svg>
